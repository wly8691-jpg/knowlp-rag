[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knowlp"
version = "3.0.1"
description = "KnowLP-RAG: Dual knowledge graph retrieval system for Markdown notes"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "峄", email = "cto@knowlp.dev"},
]
keywords = ["RAG", "knowledge-graph", "retrieval", "obsidian", "logseq", "markdown", "embedding", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "fastapi>=0.136,<1",
    "uvicorn>=0.49,<1",
]

[project.optional-dependencies]
embedding = [
    "torch>=2.4",
    "transformers>=4.45",
]
honcho = [
    "honcho-ai>=0.1",
]
mcp = [
    "mcp>=1.2,<2",
]
full = [
    "knowlp[embedding,honcho,mcp]",
]

[project.scripts]
knowlp-build = "build_graph:main"
knowlp-search = "knowlp_search:cli"
knowlp-eval = "run_eval:main"
knowlp-feedback = "record_feedback:main"
knowlp-apply = "apply_feedback:main"
knowlp-server = "server:app_entry"
knowlp-mcp = "knowlp_mcp:main"

[project.urls]
Homepage = "https://github.com/wly8691-jpg/knowlp-rag"
Documentation = "https://github.com/wly8691-jpg/knowlp-rag/wiki"
Issues = "https://github.com/wly8691-jpg/knowlp-rag/issues"

[tool.setuptools]
py-modules = [
    "build_graph",
    "knowlp_search",
    "task_modulator",
    "trajectory",
    "vector_index",
    "deep_extract",
    "run_eval",
    "record_feedback",
    "apply_feedback",
    "honcho_to_graph",
    "unified_search",
    "watch_vault",
    "config",
    "server",
    "knowlp_mcp",
    "increment",
    "auto_feedback",
    "decay",
    "activation_engine",
    "triple_hybrid",
    "pagerank",
]
