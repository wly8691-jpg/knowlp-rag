# KnowLP-RAG bundle patch for DeepSeek Harness (dsh)
#
# 安装 (npm):
#   dsh plugin add "@eqman00003/knowlp-rag"
# 安装 (github 源):
#   dsh plugin add "github:wly8691-jpg/knowlp-rag#main"
#
# 前置: Node 18+ 与 Python 3.11+。首次搜索时 bin/knowlp-mcp.mjs 会自动
# 在 ~/.knowlp-dsh/venv 自举 Python 环境 (mcp + pyyaml, 约 30s)。
#
# bundle patch 必须用 insert 形式新增条目 (裸条目会被当作"修改现有条目",
# 报 patch: entry "knowlp-mcp" not found — 2026-08-14 实测)
- insert:
    - id: knowlp-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: knowlp
        transport: stdio
        # npx 优先解析本地 node_modules 里的包 (dsh plugin add 已装好), 离线可用
        command: npx
        args:
          - '-y'
          - '@eqman00003/knowlp-rag'
        # dsh 进程的 cwd 不在 profile 目录, npx 找不到本地包。DSH_HOME 存在时
        # 直接把 cwd 指到 profile 的 node_modules (2026-08-14 实测: MCP 正常握手);
        # 不存在(npm 包已发布时)回退空字符串, 走 npx 的 registry 缓存解析。
        # 注意: 表达式里不能出现 ": "(YAML 会把 !!js 截断), 所以用 && 短路而非三元。
        cwd: !!js (process.env.DSH_HOME || '') && (process.env.DSH_HOME + '/profiles/web/node_modules/@eqman00003/knowlp-rag')
        env:
          KNOWLP_VAULT: !!js process.env.KNOWLP_VAULT
          # KNOWLP_GRAPH_DIR: !!js process.env.KNOWLP_GRAPH_DIR
          # KNOWLP_SKILL_INDEX: !!js process.env.KNOWLP_SKILL_INDEX
          # KNOWLP_EMBEDDING: '1'   # only if vector_index.json was built with --build-real
        toolCallTimeoutMs: 60000
        failOnStartupError: false
