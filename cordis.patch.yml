# KnowLP-RAG bundle patch for DeepSeek Harness (dsh)
#
# Install (npm):
#   dsh plugin add "@eqman00003/knowlp-rag"
# Install (github source):
#   dsh plugin add "github:wly8691-jpg/knowlp-rag#main"
#
# Prerequisites: Node 18+ and Python 3.11+. On first search bin/knowlp-mcp.mjs bootstraps
# a Python env in ~/.knowlp-dsh/venv (mcp + pyyaml, ~30s).
#
# 2026-08-15 P0 fix: cwd/env used to inject DSH_HOME/KNOWLP_VAULT via !!js expressions —
# on machines without those env vars they evaluated to empty string/undefined, and dsh
# 0.1.0-rc.6's zod validation (env: z.dict(String)) rejected them → dsh web crashed on
# startup (KnowLP is a preinstalled bundle of the official default profile, so every
# fresh install broke). Both optional fields are now omitted entirely (schema defaults
# env={} / cwd=""), and npx resolves the published package from the npm registry.
# vault config: users add env.KNOWLP_VAULT in their profile's cordis.patch.yml
# (template: dsh/knowlp.cordis.local.example.yml), or set a system env var.
#
# bundle patches must use insert form for new entries (a bare entry is treated as
# "modify existing", erroring with patch: entry "knowlp-mcp" not found — reproduced 2026-08-14)
- insert:
    - id: knowlp-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: knowlp
        transport: stdio
        command: npx
        args:
          - '--yes'
          - '--package'
          - '@eqman00003/knowlp-rag'
          - 'knowlp-mcp'
        toolCallTimeoutMs: 60000
        failOnStartupError: false
