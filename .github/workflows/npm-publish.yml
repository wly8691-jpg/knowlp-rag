name: npm-publish

# npm Trusted Publishing: pushing a v* tag → GitHub Actions publishes via OIDC short-lived credentials,
# no npm token required. After the first manual publish, add the trusted publisher in the
# npmjs.com package settings (owner=wly8691-jpg, repo=knowlp-rag, workflow=this file).
on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # OIDC — required for trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish
        # idempotent: skip if the version is already published (tag re-push / history cleanup won't break the run)
        # since npm 11, publish --provenance inside GitHub Actions uses OIDC end-to-end
        # (token exchange + registry auth in one step). npm 10 only signs provenance via OIDC
        # while the registry PUT stays anonymous → 404 "is not in this registry"
        # (reproduced four times on 2026-08-15, including manual token exchange).
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@eqman00003/knowlp-rag@$VERSION" version >/dev/null 2>&1; then
            echo "v$VERSION already published — skip"
            exit 0
          fi
          npm install -g npm@latest
          npm -v
          # prerelease (version contains -) publishes under the next tag, stable under latest — keeps preview builds out of the default install
          TAG=latest
          case "$VERSION" in *-*) TAG=next ;; esac
          echo "publishing @eqman00003/knowlp-rag@$VERSION → dist-tag:$TAG"
          npm publish --provenance --access public --tag "$TAG"
