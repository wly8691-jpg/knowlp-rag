name: npm-publish

# npm Trusted Publishing: push v* tag → GitHub Actions 用 OIDC 短时凭据发布,
# 不需要任何 npm token。首次手动发布后到 npmjs.com 包设置里添加 trusted
# publisher (owner=wly8691-jpg, repo=knowlp-rag, workflow=此文件)。
on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # OIDC — trusted publishing 必需
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish
        # Trusted Publishing 认证: 手工用 GitHub OIDC 换短时 token 作为
        # registry auth (audience=npm), 再发布。provenance 签名与 registry
        # 认证是两回事 — 只带 --provenance 时签名成功但 PUT 仍匿名 → 404
        # "is not in this registry" (2026-08-15 实测两次)。
        run: |
          ID_TOKEN=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm" | jq -r .value)
          npm config set //registry.npmjs.org/:_authToken "$ID_TOKEN"
          npm publish --provenance --access public
