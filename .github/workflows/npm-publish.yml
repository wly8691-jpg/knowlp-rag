name: npm-publish

# npm Trusted Publishing: push v* tag → GitHub Actions 用 OIDC 短时凭据发布,
# 不需要任何 npm token。首次手动发布后到 npmjs.com 包设置里添加 trusted
# publisher (owner=wly8691-jpg, repo=knowlp-rag, workflow=此文件)。
on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # OIDC — trusted publishing 必需
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish
        # 幂等: 版本已发布则跳过 (重推 tag / 历史清理后重打 tag 不炸 run)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@eqman00003/knowlp-rag@$VERSION" version >/dev/null 2>&1; then
            echo "v$VERSION already published — skip"
            exit 0
          fi
          npm install -g npm@latest
          npm -v
        # npm 11 起 GitHub Actions 里 publish --provenance 自动走 OIDC
        # (token 交换 + registry auth 一条龙)。npm 10 只会用 OIDC 签
        # provenance, registry PUT 仍匿名 → 404 "is not in this registry"
        # (2026-08-15 实测四次, 含手工 token 交换)。
        run: |
          npm install -g npm@latest
          npm -v
          npm publish --provenance --access public
