name: npm-publish

# npm Trusted Publishing: push v* tag → GitHub Actions 用 OIDC 短时凭据发布,
# 不需要任何 npm token。首次手动发布后到 npmjs.com 包设置里添加 trusted
# publisher (owner=wly8691-jpg, repo=knowlp-rag, workflow=此文件)。
on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # OIDC — trusted publishing 必需
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish
        run: npm publish
        # provenance (publishConfig.provenance) 需要 public repo + public 包 ✓
