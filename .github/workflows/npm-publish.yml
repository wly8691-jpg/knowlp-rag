name: npm-publish

# npm Trusted Publishing: push v* tag → GitHub Actions 用 OIDC 短时凭据发布,
# 不需要任何 npm token。首次手动发布后到 npmjs.com 包设置里添加 trusted
# publisher (owner=wly8691-jpg, repo=knowlp-rag, workflow=此文件)。
on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # OIDC — trusted publishing 必需
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish
        # --provenance 触发 OIDC 流程: npm 用 GitHub OIDC 短时凭据发布
        # (trusted publishing)。不带它 npm 匿名 PUT → registry 报 404
        # "is not in this registry" (2026-08-15 实测)。
        run: npm publish --provenance --access public
